<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7f2" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="description" content="2026-2027 学年第 1 学期个人课表" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
    <title>本学期课表</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <p class="term-label">2026–2027 · 第一学期</p>
          <h1>本学期课表</h1>
        </div>
        <div class="header-actions">
          <div class="network-state" id="network-state" role="status" aria-live="polite">
            <span class="network-dot" aria-hidden="true"></span>
            <span id="network-label">可离线使用</span>
          </div>
          <button class="manage-button" id="manage-courses" type="button">
            <span aria-hidden="true">✎</span>
            修改课程
          </button>
        </div>
      </header>

      <nav class="view-tabs" aria-label="课表视图">
        <button class="view-tab is-active" type="button" data-view="today" aria-selected="true">今天</button>
        <button class="view-tab" type="button" data-view="week" aria-selected="false">本周</button>
      </nav>

      <main>
        <section id="today-view" class="view-panel" aria-labelledby="today-heading">
          <div class="day-heading">
            <div>
              <p class="eyebrow" id="today-date"></p>
              <h2 id="today-heading">今天</h2>
            </div>
            <span class="week-badge" id="today-week"></span>
          </div>

          <div id="term-status" class="term-status" hidden></div>
          <div id="today-practice"></div>
          <div id="today-summary" class="today-summary" aria-live="polite"></div>
          <div id="today-timeline" class="timeline"></div>
          <div id="next-course"></div>
        </section>

        <section id="week-view" class="view-panel" aria-labelledby="week-heading" hidden>
          <div class="week-toolbar">
            <button class="icon-button" id="previous-week" type="button" title="上一周" aria-label="上一周">‹</button>
            <div class="week-title">
              <p class="eyebrow" id="week-range"></p>
              <h2 id="week-heading"></h2>
            </div>
            <button class="icon-button" id="next-week" type="button" title="下一周" aria-label="下一周">›</button>
          </div>
          <button class="return-button" id="current-week" type="button">回到本周</button>
          <div id="week-practice"></div>
          <div id="week-list" class="week-list"></div>
        </section>

        <section id="manage-view" class="view-panel manage-view" aria-labelledby="manage-heading" hidden>
          <div class="manage-heading">
            <button class="icon-button" id="close-manager" type="button" title="返回课表" aria-label="返回课表">‹</button>
            <div>
              <p class="eyebrow" id="manage-count"></p>
              <h2 id="manage-heading">修改课程</h2>
            </div>
            <button class="add-course-button" id="add-course" type="button">
              <span aria-hidden="true">＋</span>
              新增课程
            </button>
          </div>
          <div id="manage-list" class="manage-list"></div>
          <button class="reset-button" id="reset-courses" type="button">恢复初始课表</button>
        </section>
      </main>

      <footer>
        <span>北京时间</span>
        <span aria-hidden="true">·</span>
        <span>第 1–16 周</span>
      </footer>
    </div>

    <dialog class="course-dialog" id="course-dialog" aria-labelledby="course-dialog-title">
      <form id="course-form" method="dialog">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">课程安排</p>
            <h2 id="course-dialog-title">新增课程</h2>
          </div>
          <button class="dialog-close" id="close-course-dialog" type="button" title="关闭" aria-label="关闭">×</button>
        </div>

        <input id="course-id" name="courseId" type="hidden" />

        <label class="form-field">
          <span>课程名称</span>
          <input id="course-name" name="courseName" type="text" maxlength="50" autocomplete="off" required />
        </label>

        <div class="form-grid">
          <label class="form-field">
            <span>星期</span>
            <select id="course-weekday" name="weekday" required>
              <option value="1">星期一</option>
              <option value="2">星期二</option>
              <option value="3">星期三</option>
              <option value="4">星期四</option>
              <option value="5">星期五</option>
            </select>
          </label>
          <div class="form-field">
            <span>上课节次</span>
            <div class="period-selects">
              <select id="period-start" name="periodStart" aria-label="开始节次" required></select>
              <span aria-hidden="true">至</span>
              <select id="period-end" name="periodEnd" aria-label="结束节次" required></select>
            </div>
          </div>
        </div>

        <output class="time-preview" id="time-preview" aria-live="polite"></output>

        <label class="form-field">
          <span>地点</span>
          <input id="course-location" name="location" type="text" maxlength="50" autocomplete="off" required />
        </label>

        <label class="switch-field">
          <span>线上课程</span>
          <input id="course-online" name="online" type="checkbox" />
        </label>

        <fieldset class="tone-fieldset">
          <legend>课程颜色</legend>
          <div class="tone-options" id="course-tones"></div>
        </fieldset>

        <fieldset class="weeks-fieldset">
          <legend>上课周次</legend>
          <div class="week-presets" aria-label="周次快捷选择">
            <button type="button" data-week-preset="all">全学期</button>
            <button type="button" data-week-preset="odd">单周</button>
            <button type="button" data-week-preset="even">双周</button>
            <button type="button" data-week-preset="clear">清空</button>
          </div>
          <div class="week-checkboxes" id="week-checkboxes"></div>
        </fieldset>

        <p class="form-error" id="form-error" role="alert" hidden></p>

        <div class="dialog-actions">
          <button class="secondary-button" id="cancel-course" type="button">取消</button>
          <button class="primary-button" type="submit">保存课程</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <noscript>需要启用 JavaScript 才能按日期筛选课程。</noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
